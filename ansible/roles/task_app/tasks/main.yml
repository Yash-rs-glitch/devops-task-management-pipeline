- name: Create application directory
  file:
    path: /tmp/task-management-api
    state: directory
    mode: '0755'

- name: Copy application files
  copy:
    src: "{{ playbook_dir }}/../{{ item }}"
    dest: "/tmp/task-management-api/{{ item }}"
    mode: '0644'
  loop:
    - app.py
    - requirements.txt

- name: Verify application files
  stat:
    path: "/tmp/task-management-api/{{ item }}"
  register: app_files
  loop:
    - app.py
    - requirements.txt

- name: Confirm deployment files
  assert:
    that:
      - item.stat.exists
  loop: "{{ app_files.results }}"
